name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev ccache

      - name: Install buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Accept Android licenses and prepare buildozer SDK
        run: |
          SDK=/home/runner/.buildozer/android/platform/android-sdk
          mkdir -p $SDK/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $SDK/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > $SDK/licenses/android-sdk-preview-license
          # buildozer ожидает старый layout: tools/bin/sdkmanager
          mkdir -p $SDK/tools/bin $SDK/cmdline-tools
          curl -sL -o /tmp/clt.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q /tmp/clt.zip -d $SDK/cmdline-tools
          # sdkmanager должен лежать в tools/bin
          cp -r $SDK/cmdline-tools/cmdline-tools/* $SDK/tools/
          chmod +x $SDK/tools/bin/sdkmanager
          yes | $SDK/tools/bin/sdkmanager --sdk_root=$SDK --licenses > /dev/null || true
          $SDK/tools/bin/sdkmanager --sdk_root=$SDK "platform-tools" "build-tools;34.0.0" "platforms;android-34" > /dev/null

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: equipment-apk
          path: bin/*.apk
